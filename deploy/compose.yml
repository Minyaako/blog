services:
  blog:
    image: ${BLOG_IMAGE:?BLOG_IMAGE is required}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    env_file:
      - ${RANKING_ENV_FILE:?RANKING_ENV_FILE is required}
    environment:
      RANKING_DATABASE: /var/lib/blog-ranking/ranking.sqlite
    volumes:
      - type: bind
        source: ${RANKING_DATA_DIR:?RANKING_DATA_DIR is required}
        target: /var/lib/blog-ranking
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:size=16m,mode=0700,uid=1000,gid=1000
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/healthz]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    networks:
      server_proxy:
        aliases: [blog]

networks:
  server_proxy:
    external: true
