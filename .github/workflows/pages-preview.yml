name: Editor preview Pages

on:
  push:
    branches: [editor-preview]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: editor-preview-pages
  cancel-in-progress: true

env:
  PUBLIC_BLOG_PREVIEW: "true"
  PUBLIC_PREVIEW_BRANCH: editor-preview
  PUBLIC_PREVIEW_SHA: ${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - id: pages
        uses: actions/configure-pages@v5
      - name: Record immutable preview build time
        run: echo "PUBLIC_PREVIEW_BUILD_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm media:validate
      - run: pnpm check
      - run: pnpm test:unit
      - name: Build public preview
        run: |
          pnpm exec astro build --site "https://preview.gsk.minyako.top"
          pnpm build:search
      - name: Verify preview safety markers
        run: |
          test -f dist/index.html
          grep -F 'name="robots" content="noindex, noarchive"' dist/index.html
          grep -F 'data-preview-banner' dist/index.html
          grep -F 'editor-preview' dist/index.html
          if grep -R -F 'data-comment-slot' dist/posts; then
            echo 'Preview build unexpectedly contains a live comment mount' >&2
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

